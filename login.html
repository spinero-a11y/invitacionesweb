<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Editor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .auth-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #e5e7eb;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      font-weight: bold;
      color: #6b7280;
      cursor: pointer;
    }

    .tab-btn.active {
      color: #4f46e5;
      border-bottom: 2px solid #4f46e5;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #374151;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #4338ca;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
      <button class="tab-btn" onclick="switchTab('register')">Registrarse</button>
    </div>

    <!-- Formulario de Login -->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Correo electrónico</label>
        <input type="email" id="loginEmail" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit">Entrar al Editor</button>
    </form>

    <!-- Formulario de Registro -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label for="regName">Nombre</label>
        <input type="text" id="regName" required placeholder="Tu Nombre">
      </div>
      <div class="form-group">
        <label for="regEmail">Correo electrónico</label>
        <input type="email" id="regEmail" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label for="regPassword">Contraseña</label>
        <input type="password" id="regPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit">Crear Cuenta</button>
    </form>
  </div>

  <script>
    // Cambiar entre pestañas
    function switchTab(type) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const btns = document.querySelectorAll('.tab-btn');

      if (type === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        btns[0].classList.add('active');
        btns[1].classList.remove('active');
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        btns[0].classList.remove('active');
        btns[1].classList.add('active');
      }
    }

    // Petición real de Iniciar Sesión (Login)
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Guardar el token de sesión en el navegador
          localStorage.setItem('token', data.token);
          alert('¡Inicio de sesión exitoso!');
          window.location.href = 'editor.html';
        } else {
          alert(data.mensaje || 'Error al iniciar sesión');
        }
      } catch (error) {
        console.error('Error de conexión:', error);
        alert('No se pudo conectar con el servidor.');
      }
    });

    // Petición real de Registro
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const nombre = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      try {
        const response = await fetch('/api/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Usuario registrado correctamente. Ahora puedes iniciar sesión.');
          switchTab('login'); // Cambia a la pestaña de login automáticamente
        } else {
          alert(data.mensaje || 'Error al registrar usuario');
        }
      } catch (error) {
        console.error('Error de conexión:', error);
        alert('No se pudo conectar con el servidor.');
      }
    });
  </script>
</body>
</html>
